<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深色背景渐变 -->
    <radialGradient id="robotBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
    <!-- 金属机身渐变 -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="45%" stop-color="#e5e7eb"/>
      <stop offset="55%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <!-- 蓝色发光眼灯 -->
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- 天线红光 -->
    <filter id="glowRed" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 底板阴影 -->
  <circle cx="80" cy="80" r="78" fill="#000000" opacity="0.3"/>
  <!-- 圆形背景 -->
  <circle cx="80" cy="80" r="75" fill="url(#robotBg)"/>
  <!-- 天线 -->
  <line x1="80" y1="22" x2="80" y2="6" stroke="#adb5bd" stroke-width="3"/>
  <circle cx="80" cy="6" r="6" fill="#ef4444" filter="url(#glowRed)"/>
  <!-- 机器头外壳 -->
  <rect x="34" y="26" width="92" height="82" rx="14" fill="url(#metal)"/>
  <!-- 顶部散热槽 -->
  <g stroke="#4b5563" stroke-width="2">
    <line x1="44" y1="36" x2="56" y2="36"/>
    <line x1="64" y1="36" x2="76" y2="36"/>
    <line x1="84" y1="36" x2="96" y2="36"/>
    <line x1="104" y1="36" x2="116" y2="36"/>
  </g>
  <!-- 双眼发光屏 -->
  <rect x="44" y="50" width="24" height="20" rx="4" fill="#0ea5e9" filter="url(#glowBlue)"/>
  <rect x="92" y="50" width="24" height="20" rx="4" fill="#0ea5e9" filter="url(#glowBlue)"/>
  <!-- 瞳孔黑点 -->
  <circle cx="56" cy="60" r="5" fill="#0f172a"/>
  <circle cx="104" cy="60" r="5" fill="#0f172a"/>
  <!-- 嘴巴显示屏 -->
  <rect x="48" y="82" width="64" height="14" rx="3" fill="#0f172a"/>
  <!-- 屏幕线条 -->
  <g stroke="#22d3ee" stroke-width="1.8">
    <line x1="54" y1="89" x2="68" y2="89"/>
    <line x1="74" y1="89" x2="86" y2="89"/>
    <line x1="92" y1="89" x2="106" y2="89"/>
  </g>
  <!-- 侧面螺丝装饰 -->
  <circle cx="40" cy="44" r="3" fill="#374151"/>
  <circle cx="120" cy="44" r="3" fill="#374151"/>
  <circle cx="40" cy="90" r="3" fill="#374151"/>
  <circle cx="120" cy="90" r="3" fill="#374151"/>
  <!-- 机械脖颈 -->
  <rect x="62" y="110" width="36" height="16" rx="4" fill="#6b7280"/>
  <line x1="66" y1="118" x2="94" y2="118" stroke="#374151" stroke-width="2"/>
  <!-- 机身底座肩膀 -->
  <path d="M42 144 C42 128 56 122 80 122 C104 122 118 128 118 144 L118 156 L42 156 Z" fill="#1f2937"/>
</svg>